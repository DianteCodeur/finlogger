<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>FinLogger</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body style="background-color: #f3f3f3;">
    
    <header class="header d-flex justify-content-between align-items-center px-4 py-3 mb-4 col-md-12 border-bottom">
        
        <div class="logo">
            <h1 class="h3 m-0">FinLogger</h1>
        </div>

        <div class="user-info d-flex align-items-center">
            <span class="tagline">Your financial diary!</span>
        </div>

    </header>

    <main class="main-container container">

        <div class="row">

            <div class="col-md-6 mb-4">

                <h1 class="h4 mb-3" style="text-transform: uppercase;">Overview</h1>
            
            </div>

            <div class="col-md-6 mb-4 text-md-end">

                <input type="month" id="monthPicker" class="form-control d-inline-block w-auto me-2"/>

                <button id="addEntryBtn" class="btn btn-primary">Add Entry</button>

            </div>
                
        </div>

        <div id="entriesContainer" class="row w-auto g-4">
            <!-- Entries will be dynamically added here -->

            <div class="card col-md-4">

                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="card-icon">
                            <!-- Icon -->
                            <img src="./images/spending.png" alt="Expenses" width="40px"/>
                        </div>
                        <div>
                            <!-- Text -->
                            <p class="card-text">Expenses</p>
                            <h5 class="card-title" id="totalExpenses"></h5>
                        </div>
                    </div>
                </div>

            </div>

            <div class="card col-md-4">

                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="card-icon">
                            <!-- Icon -->
                            <img src="./images/income.png" alt="Income" width="40px"/>
                        </div>
                        <div>
                            <!-- Text -->
                            <p class="card-text">Monthly Income</p>
                            <h5 class="card-title" id="income"></h5>
                        </div>
                    </div>
                </div>

            </div>

            <div class="card col-md-4">

                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="card-icon">
                            <!-- Icon -->
                            <img src="./images/balance.png" alt="Balance" width="40px"/>
                        </div>
                        <div>
                            <!-- Text -->
                            <p class="card-text">Balance</p>
                            <h5 class="card-title" id="balance"></h5>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <div id="entriesList" class="mt-4">
            <!-- Detailed entries will be dynamically added here -->

            <div class="row">

                <div class="col-md-4">

                    <h2 class="h5 mb-3">Expense Summary</h2>
                    <table id="expense-summary" class="table border">
                    <thead>
                        <tr>
                            <th>EXPENSE CATEGORY</th>
                            <th>%</th>
                        </tr>
                    </thead>
                    <tbody id="idExpenseSummary">
                        <!-- Summary will be populated here -->
                    </tbody>
                    </table>

                </div>

                <div class="col-md-8">

                    <h2 class="h5 mb-3">Expense Details</h2>
                    <table id="expense-details" class="table table-striped">
                        <thead>
                            <tr>
                                <th scope="col">DATE</th>
                                <th scope="col">DESCRIPTION</th>
                                <th scope="col">AMOUNT</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody id="entriesTableBody">
                            <!-- Entries will be populated here -->
                        </tbody>
                    </table>

                </div>

            </div>
        
        </div>

        <!-- Modal Containers -->
         <!-- Edit Modal -->
        <div class="modal fade" tabindex="-1" id="expenseModal" role="dialog">
            <div class="modal-dialog" role="document">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Add Expense</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <div class="form-group p-4">
                            <form id="expenseForm">
                                <div class="mb-3">
                                    <label for="date" class="form-label">Date</label>
                                    <input type="date" class="form-control" id="date" required>
                                </div>
                                <div class="mb-3">
                                    <label for="category" class="form-label">Category</label>
                                    <select class="form-control" id="category">
                                        <option value="">--Select Category--</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <input type="text" class="form-control" id="description" placeholder="Enter description">
                                </div>
                                <div class="mb-3">
                                    <label for="amount" class="form-label">Amount</label>
                                    <input type="number" class="form-control" id="amount" placeholder="Enter amount" required>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="modal-footer">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="expense-submit-btn">Submit</button>
                    </div>

                    </div>

                </div>
            </div>
        </div>

        <!-- Delete Modal -->
        <div class="modal fade" tabindex="-1" id="deleteModal" role="dialog">
            <div class="modal-dialog" role="document">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Delete Expense</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <p>Are you sure you want to delete this expense?</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                    </div>
                </div>
            </div>
        </div>


    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> 
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="data.js"></script> 
    <script src='script.js'></script>

</body>

</html>
