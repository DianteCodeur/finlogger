name: Finlogger Front CI

on:
  push:
    branches: [ main ]
    paths:
      - "react-ui/**"
      - ".github/workflows/front-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "react-ui/**"
      - ".github/workflows/front-ci.yml"
  workflow_dispatch:

jobs:
  test-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: react-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true
